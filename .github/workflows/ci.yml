name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.16.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # the app targets windows, the stubs keep the checks buildable elsewhere
      - name: go vet
        run: |
          GOOS=windows go vet ./...
          go vet ./internal/...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.14

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # -short skips the live probes: runners have Defender switched off and no Security Center,
      # so they would only show that this machine is unprotected
      - name: unit tests
        shell: bash
        run: go test -race -short -count=1 ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # the tool is built for the runner by the same toolchain as the module, and scans the
      # windows build of the module
      - name: govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  build:
    runs-on: windows-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      # windows-2025 images ship without nsis, and wails only warns when makensis is missing
      - name: install nsis
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          'C:\Program Files (x86)\NSIS\Bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: build
        shell: bash
        run: >
          wails build -clean -trimpath -m -nosyncgomod -webview2 embed -nsis
          -ldflags "-X github.com/blsssss/mamori/internal/version.Version=ci-${GITHUB_SHA::7}
          -X github.com/blsssss/mamori/internal/version.Commit=${GITHUB_SHA::7}"
      - name: check the installer exists
        shell: bash
        run: ls build/bin/mamori-amd64-installer.exe
      # the bindings are committed so that the frontend can be checked without the wails cli
      - name: bindings are up to date
        shell: bash
        run: git diff --exit-code -- frontend/wailsjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mamori-windows-amd64
          path: |
            build/bin/mamori.exe
            build/bin/mamori-amd64-installer.exe
          retention-days: 7

  e2e:
    runs-on: windows-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mamori-windows-amd64
      # the runner is elevated, so the firewall rule test runs for real here
      - name: headless run of every check
        shell: pwsh
        run: ./scripts/e2e.ps1 -Exe ./mamori.exe -Out "$env:RUNNER_TEMP"
