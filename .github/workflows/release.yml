name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # no npm cache in a job that can write to the repository
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      # windows-2025 images ship without nsis, and wails only warns when makensis is missing
      - name: install nsis
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          'C:\Program Files (x86)\NSIS\Bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: makensis /VERSION
      - name: version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          jq --arg v "$v" '.info.productVersion = $v' wails.json > wails.tmp && mv wails.tmp wails.json
      - name: build
        shell: bash
        run: >
          wails build -clean -trimpath -m -nosyncgomod
          -platform windows/amd64,windows/arm64 -webview2 embed -nsis
          -ldflags "-X github.com/blsssss/mamori/internal/version.Version=${VERSION}
          -X github.com/blsssss/mamori/internal/version.Commit=${GITHUB_SHA::7}"
      - name: check the installers exist
        shell: bash
        run: ls build/bin/mamori-amd64-installer.exe build/bin/mamori-arm64-installer.exe
      - name: checksums
        shell: bash
        working-directory: build/bin
        run: sha256sum *.exe > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/bin/*.exe
      # a draft: the title and the notes are written by hand before publishing
      - name: draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" build/bin/*.exe build/bin/SHA256SUMS.txt
          --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
